<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Điện Máy Hiếu - Mua sắm điện máy, gọi thợ tận nhà tại Lấp Vò, Đồng Tháp.">
  <title>Điện Máy Hiếu</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0f172a; color: #38bdf8;
      z-index: 9999; transition: opacity .35s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader .brand {
      font-size: 26px; font-weight: 900; letter-spacing: -0.5px;
      display: flex; align-items: center; gap: 10px;
    }
    #loader .sub {
      margin-top: 12px; font-size: 13px; color: #94a3b8;
    }
    #loader .spinner {
      margin-top: 24px; width: 32px; height: 32px;
      border: 3px solid rgba(56,189,248,0.2);
      border-top-color: #38bdf8; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #appFrame {
      width: 100%; height: 100%; border: none; display: block;
      background: #0f172a;
    }
    #offline, #error {
      display: none; position: fixed; inset: 0;
      background: #0f172a; color: #fff;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 30px; text-align: center; z-index: 10000;
    }
    #offline i, #error i { font-size: 48px; color: #f59e0b; margin-bottom: 16px; }
    #error .detail { margin-top: 12px; font-size: 13px; color: #94a3b8; max-width: 320px; }
  </style>
</head>
<body>
  <div id="loader">
    <div class="brand">⚡ Điện Máy Hiếu</div>
    <div class="sub">Đang tải hệ sinh thái...</div>
    <div class="spinner"></div>
  </div>

  <div id="offline">
    <div>📡 Không có kết nối mạng</div>
    <div style="margin-top:12px;font-size:14px;color:#94a3b8;">Vui lòng kiểm tra lại mạng và thử lại.</div>
  </div>

  <div id="error">
    <div>⚠️ Không thể tải trang</div>
    <div class="detail">Vui lòng kiểm tra kết nối hoặc liên hệ hotline 0979.553.289.</div>
  </div>

  <iframe
    id="appFrame"
    src="https://dienmayhieu.com/"
    allow="geolocation; microphone; camera"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals allow-top-navigation"
    loading="eager"
    referrerpolicy="origin"
    title="Điện Máy Hiếu"
  ></iframe>

  <script>
    (function() {
      var loader = document.getElementById('loader');
      var frame = document.getElementById('appFrame');
      var offline = document.getElementById('offline');
      var error = document.getElementById('error');

      function hideLoader() {
        loader.classList.add('hidden');
      }

      function showError() {
        error.style.display = 'flex';
        hideLoader();
      }

      frame.addEventListener('load', hideLoader);
      frame.addEventListener('error', showError);
      setTimeout(function() {
        if (!loader.classList.contains('hidden')) {
          // Nếu sau 8 giây chưa load xong, vẫn ẩn loader để tránh treo
          hideLoader();
        }
      }, 8000);

      function updateOnlineStatus() {
        offline.style.display = navigator.onLine ? 'none' : 'flex';
      }
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      updateOnlineStatus();
    })();
  </script>
</body>
</html>
